name: keycloak_client
description: A Flutter package for Keycloak authentication using the Authorization Code flow.
version: 0.0.1
repository: https://github.com/FlameOfUdun/keycloak-client-flutter
issue_tracker: https://github.com/FlameOfUdun/keycloak-client-flutter/issues

environment:
  sdk: ^3.10.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  logger: ^2.7.0
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  flutter_web_auth_2: ^5.0.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1

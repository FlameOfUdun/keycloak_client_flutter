version: 2.1.0
repository: https://github.com/FlameOfUdun/keycloak_client_flutter
issue_tracker: https://github.com/FlameOfUdun/keycloak_client_flutter/issues

environment:
  sdk: ^3.10.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  logger: ^2.7.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  oauth2: ^2.0.5
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  web: ^1.1.1
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1
